[package]
name = "weirdnet-sync"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet sync: hybrid logical clocks, an op log, LWW and OR-set merge, tombstone GC, SyncKey page sealing, a device roster with self-cert, revocation, key rotation with re-admission, user-signed device grants and service devices linked without the seed, and the weirdnet-sync/v1 pull protocol over weirdnet-net."
authors = ["m3talsmith <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-sync"
documentation = "https://docs.rs/weirdnet-sync"
readme = "README.md"
keywords = ["p2p", "crdt", "sync", "replication", "weirdnet"]
categories = ["network-programming", "data-structures"]
include = ["src/**", "README.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
blake3 = "1.8"
cbor4ii = { version = "1.2", features = ["serde1", "use_std"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
weirdnet-keys = { version = "0.1.0", default-features = false }
weirdnet-net = "0.8.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
