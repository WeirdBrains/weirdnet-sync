[package]
name = "weirdnet-sync"
version = "0.8.2"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet sync: hybrid logical clocks, an op log, LWW and OR-set merge, tombstone GC, SyncKey page sealing, a device roster with self-cert, revocation, key rotation with re-admission, user-signed device grants and service devices linked without the seed, majority-vote leases with fencing terms, signed plans and a job log, and the /weirdnet/sync/2 pull protocol over weirdnet-net."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-sync"
documentation = "https://docs.rs/weirdnet-sync"
readme = "README.md"
keywords = ["p2p", "crdt", "sync", "replication", "weirdnet"]
categories = ["network-programming", "data-structures"]
include = ["src/**", "README.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
blake3 = "1.8"
cbor4ii = { version = "1.2", features = ["serde1", "use_std"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
weirdnet-keys = { version = "0.1.0", default-features = false }
weirdnet-net = "0.8.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
# Wire and record compatibility tests against the published 0.7.1.
weirdnet-sync-07 = { package = "weirdnet-sync", version = "=0.7.1" }
# Wire compatibility of 0.8.3 chains, key exports and scoped envelopes with the published 0.8.2.
weirdnet-sync-082 = { package = "weirdnet-sync", version = "=0.8.2" }
